name: CI

on:
  # PR 브랜치는 pull_request로 검사한다. push까지 받으면 커밋 하나에 두 번 돈다.
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm build
      # API 테스트는 api-test.yml이 apps/api가 바뀔 때만 돌린다.
      - run: pnpm --filter @lsp/web test

  capture-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # 러너 이미지에 미리 설치된 Google Chrome을 쓴다(channel: 'chrome').
      - run: google-chrome --version
      - run: pnpm --filter @lsp/web e2e
